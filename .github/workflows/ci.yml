name: CI Pipeline - Build, Push and Create GitOps PR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: airstream-petclinic
  AWS_ACCOUNT_ID: 749474900204

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set Release Version
      run: |
        VERSION="v1.0.${{ github.run_number }}"
        echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV
        echo "Building image version: $VERSION"

    - name: Build and Push Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Create Automated GitOps Pull Request
      env:
        GITOPS_REPO: "mataz96/airstream-gitops-manifests"
        GH_TOKEN: ${{ secrets.PAT_GITHUB }}
      run: |
        git clone https://x-access-token:$GH_TOKEN@github.com/$GITOPS_REPO.git gitops-repo
        cd gitops-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -b promote-$IMAGE_TAG
        cd k8s
        sed -i "s/newTag:.*/newTag: $IMAGE_TAG/g" kustomization.yaml
        git commit -am "chore(release): bump petclinic image to $IMAGE_TAG"
        git push origin promote-$IMAGE_TAG
        gh pr create \
          --repo $GITOPS_REPO \
          --title "release(production): promote petclinic to $IMAGE_TAG" \
          --body "Automated release PR for image tag $IMAGE_TAG. Review and merge to trigger Argo CD deployment." \
          --base main \
          --head promote-$IMAGE_TAG